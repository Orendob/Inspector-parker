<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1408">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Inspector Parker</title>
<style>
  :root {
    --bg: #1a1408;
    --panel: #2a2010;
    --panel-2: #3a2c18;
    --frame: #6b4a22;
    --frame-2: #8a6532;
    --gold: #e0bc62;
    --gold-dim: #a6863a;
    --ink: #f1e6c8;
    --ink-dim: #b8a880;
    --red: #c04a3a;
    --green: #6ba858;
    --shadow: 0 6px 22px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #2c2010 0%, #1a1408 60%), var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 600px; margin: 0 auto; padding: 24px 16px 40px; }
  header {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--frame);
    margin-bottom: 18px;
  }
  .banner {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--frame-2);
    margin-bottom: 6px;
  }
  .banner svg { height: 60px; width: 100%; max-width: 340px; }
  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 1px 0 #000, 0 0 14px rgba(224,188,98,0.35);
  }
  .sub {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .intro { font-size: 14px; line-height: 1.55; margin: 0 4px 20px; }
  .intro .victim { color: var(--red); font-weight: bold; }
  [hidden] { display: none !important; }

  /* Difficulty cards */
  .cards { display: grid; gap: 14px; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #1f1408 100%);
    border: 2px solid var(--frame);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(224,188,98,0.06);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.06s, border-color 0.15s;
    text-decoration: none;
    font-family: inherit;
    text-align: left;
    width: 100%;
  }
  .card:active { transform: translateY(1px); }
  .card:hover { border-color: var(--gold-dim); }
  .card .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px dashed var(--gold-dim);
    padding-bottom: 6px;
    margin-bottom: 8px;
  }
  .card h2 { margin: 0; font-size: 20px; letter-spacing: 1px; color: var(--gold); }
  .card .tag {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(224,188,98,0.12);
    border: 1px solid var(--frame-2);
    border-radius: 4px;
    padding: 2px 7px;
  }
  .card p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
  .card ul { margin: 0 0 10px; padding-left: 20px; font-size: 12.5px; line-height: 1.55; color: var(--ink-dim); }
  .card .play {
    align-self: flex-end;
    background: linear-gradient(180deg, #e0bc62, #b88c30);
    color: #1a1408;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 10px 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .card .progress {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .card .progress b { color: var(--gold); }

  /* Levels view */
  .levels-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .back-btn {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--frame);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .levels-title {
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex: 1;
    text-align: center;
  }
  .levels-progress {
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.5px;
  }
  .levels-progress b { color: var(--gold); }
  .reset-btn {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--frame);
    border-radius: 5px;
    padding: 5px 9px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
  }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 460px;
    margin: 0 auto;
  }
  .level-tile {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--panel-2), #1f1408);
    border: 2px solid var(--frame);
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    position: relative;
    transition: transform 0.06s, border-color 0.15s;
    line-height: 1.1;
  }
  .level-tile .num { font-weight: bold; font-size: 17px; }
  .level-tile .time {
    font-size: 10px;
    color: var(--ink-dim);
    margin-top: 2px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    letter-spacing: 0.3px;
  }
  .level-tile.done .time { color: var(--green); }
  .level-tile:active { transform: translateY(1px); }
  .level-tile:hover { border-color: var(--gold-dim); }
  .level-tile.done {
    background: linear-gradient(180deg, #3a5a2a, #1f3a14);
    border-color: var(--green);
    color: var(--ink);
  }
  .level-tile.done::after {
    content: '✓';
    position: absolute;
    top: 2px; right: 5px;
    font-size: 11px;
    color: var(--green);
    font-weight: bold;
  }
  footer {
    margin-top: 22px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 11px;
    line-height: 1.5;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="banner">
      <svg viewBox="0 0 360 64" xmlns="http://www.w3.org/2000/svg">
        <circle cx="305" cy="20" r="11" fill="currentColor" opacity="0.7"/>
        <circle cx="300" cy="16" r="9" fill="#1a1408"/>
        <path d="M22 56 L22 34 L44 34 L44 22 L66 22 L66 8 L110 8 L110 22 L142 22 L142 16 L186 16 L186 22 L222 22 L222 8 L268 8 L268 22 L290 22 L290 34 L312 34 L312 56 Z" fill="currentColor"/>
        <rect x="76" y="24" width="6" height="10" fill="#e0bc62" opacity="0.6"/>
        <rect x="94" y="24" width="6" height="10" fill="#e0bc62" opacity="0.6"/>
        <rect x="160" y="24" width="6" height="8" fill="#e0bc62" opacity="0.4"/>
        <rect x="232" y="24" width="6" height="10" fill="#e0bc62" opacity="0.6"/>
        <rect x="246" y="24" width="6" height="10" fill="#e0bc62" opacity="0.6"/>
      </svg>
    </div>
    <h1>INSPECTOR PARKER</h1>
    <div class="sub">— Logic Mysteries —</div>
  </header>

  <!-- Difficulty selector -->
  <div id="viewDiff">
    <p class="intro">A guest of the manor has been <span class="victim">murdered</span>. Read the picture clues, cross out the impossibilities, and unmask the killer. Fifty cases per difficulty — every player gets the same level <i>N</i>.</p>
    <div class="cards">
      <button class="card" id="btnEasy" type="button">
        <div class="head">
          <h2>Easy</h2>
          <span class="tag">2 × 2 manor</span>
        </div>
        <p>4 rooms, 4 suspects, 4 weapons. Every candidate visible in every room from the start. A handful of clues per case.</p>
        <ul>
          <li>Quick to solve</li>
          <li>~8 clues per case</li>
        </ul>
        <div class="progress" id="progEasy"></div>
        <span class="play">Play Easy</span>
      </button>
      <button class="card" id="btnHard" type="button">
        <div class="head">
          <h2>Hard</h2>
          <span class="tag">3 × 3 manor</span>
        </div>
        <p>9 rooms, 9 suspects, 9 weapons. Some candidates are pre-eliminated per room (shown as dark slots). More clues, deeper chains.</p>
        <ul>
          <li>Roomier puzzle space</li>
          <li>~14 clues per case</li>
        </ul>
        <div class="progress" id="progHard"></div>
        <span class="play">Play Hard</span>
      </button>
    </div>
  </div>

  <!-- Level grid (50 tiles) -->
  <div id="viewLevels" hidden>
    <div class="levels-bar">
      <button class="back-btn" id="btnBack" type="button">← Difficulty</button>
      <div class="levels-title" id="lvlTitle">Easy</div>
      <button class="reset-btn" id="btnResetProgress" type="button" title="Clear all completion marks for this difficulty">Reset progress</button>
    </div>
    <div class="levels-bar" style="margin-top:-6px;">
      <div></div>
      <div class="levels-progress" id="lvlProgress"></div>
      <div></div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <footer>Single-file, plays offline. Progress saved in your browser. <span id="version">v2</span></footer>

</div>

<script>
(function () {
  'use strict';
  const NUM_LEVELS = 50;
  const KEY = diff => 'parker-completed-' + diff;

  function readCompleted(diff) {
    try { return JSON.parse(localStorage.getItem(KEY(diff)) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function writeCompleted(diff, obj) {
    try { localStorage.setItem(KEY(diff), JSON.stringify(obj)); } catch (e) {}
  }
  function countCompleted(diff) {
    const c = readCompleted(diff);
    let n = 0;
    // A solved level may be stored as `true` (legacy) or a number of
    // seconds (best time). Anything that isn't undefined/null/false counts.
    for (let i = 1; i <= NUM_LEVELS; i++) {
      const v = c[i];
      if (v !== undefined && v !== null && v !== false) n++;
    }
    return n;
  }
  function refreshDiffProgress() {
    const e = countCompleted('easy'), h = countCompleted('hard');
    document.getElementById('progEasy').innerHTML = 'Progress: <b>' + e + '</b> / ' + NUM_LEVELS + ' solved';
    document.getElementById('progHard').innerHTML = 'Progress: <b>' + h + '</b> / ' + NUM_LEVELS + ' solved';
  }

  function showDiff() {
    document.getElementById('viewDiff').hidden = false;
    document.getElementById('viewLevels').hidden = true;
    if (location.hash) location.hash = '';
    refreshDiffProgress();
  }
  function showLevels(diff) {
    document.getElementById('viewDiff').hidden = true;
    document.getElementById('viewLevels').hidden = false;
    document.getElementById('lvlTitle').textContent = (diff === 'easy' ? 'Easy — 2 × 2 manor' : 'Hard — 3 × 3 manor');
    location.hash = diff;
    renderLevelGrid(diff);
  }
  function fmtTime(s) {
    if (typeof s !== 'number' || s < 0) return '';
    const m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function renderLevelGrid(diff) {
    const completed = readCompleted(diff);
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    let count = 0;
    for (let i = 1; i <= NUM_LEVELS; i++) {
      const tile = document.createElement('a');
      const val = completed[i];
      const done = val !== undefined && val !== null && val !== false;
      tile.className = 'level-tile' + (done ? ' done' : '');
      tile.href = 'index2.html?d=' + diff + '&n=' + i;
      // Number on top, best time underneath when known.
      const time = (typeof val === 'number') ? fmtTime(val) : '';
      tile.innerHTML =
        '<span class="num">' + i + '</span>' +
        (time ? '<span class="time">' + time + '</span>' : '');
      grid.appendChild(tile);
      if (done) count++;
    }
    document.getElementById('lvlProgress').innerHTML = '<b>' + count + '</b> / ' + NUM_LEVELS + ' solved';
    document.getElementById('btnResetProgress').dataset.diff = diff;
  }

  document.getElementById('btnEasy').addEventListener('click', () => showLevels('easy'));
  document.getElementById('btnHard').addEventListener('click', () => showLevels('hard'));
  document.getElementById('btnBack').addEventListener('click', showDiff);
  document.getElementById('btnResetProgress').addEventListener('click', (e) => {
    const diff = e.currentTarget.dataset.diff;
    if (!diff) return;
    if (confirm('Reset all completion marks for ' + (diff === 'easy' ? 'Easy' : 'Hard') + '?')) {
      writeCompleted(diff, {});
      renderLevelGrid(diff);
    }
  });

  // Honour hash on load (e.g. returning from a level via "Back to levels")
  if (location.hash === '#easy') showLevels('easy');
  else if (location.hash === '#hard') showLevels('hard');
  else refreshDiffProgress();
})();
</script>
</body>
</html>
